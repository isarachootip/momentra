services:
  # 1. Momentra Core API
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: momentra_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://momentra:momentrapass@postgres:5432/momentra_db?sslmode=disable
      - DATABASE_SSL=false
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_momentra_development_jwt_key_2026_secure_minimum_32_chars
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=momentra-assets-dev
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - CLAMAV_HOST=clamav
      - CLAMAV_PORT=3310
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - momentra_net

  # 2. PostgreSQL 16 with pgvector & Extensions
  postgres:
    image: pgvector/pgvector:pg16
    container_name: momentra_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=momentra
      - POSTGRES_PASSWORD=momentrapass
      - POSTGRES_DB=momentra_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momentra -d momentra_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - momentra_net

  # 3. Redis 7 for Cache & BullMQ Job Queue
  redis:
    image: redis:7-alpine
    container_name: momentra_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - momentra_net

  # 4. MinIO S3-Compatible Local Object Storage
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: momentra_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - momentra_net

  # MinIO Auto Bucket Creation Helper
  createbuckets:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/momentra-assets-dev;
      exit 0;
      "
    networks:
      - momentra_net

  # 5. ClamAV Virus Scanner Daemon
  clamav:
    image: clamav/clamav:latest
    container_name: momentra_clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamavdata:/var/lib/clamav
    networks:
      - momentra_net

volumes:
  pgdata:
  redisdata:
  miniodata:
  clamavdata:

networks:
  momentra_net:
    driver: bridge
