name: Momentra CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # 1. Quality & Security Gate (Lint, Test & Security Scan)
  # ============================================================================
  test-and-scan:
    name: Lint, Test & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Validate OpenAPI 3.1 Contract
        run: npx --yes @stoplight/spectral-cli lint api/openapi.yaml

      - name: Run Automated Tests & Verify Coverage
        run: npm run test:coverage
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test_jwt_secret_key_minimum_32_characters_long_ci' }}

      - name: Run Trivy Security Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # 2. Build & Container Image Push
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Image
    needs: test-and-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. Deploy to Staging & Production with Automated Rollback
  # ============================================================================
  deploy-production:
    name: Deploy to Production VPS
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "==> Pulling latest images from GHCR..."
            cd /opt/momentra
            docker compose -f docker-compose.prod.yml pull

            echo "==> Running database migrations..."
            # Execute idempotent migration scripts if present
            
            echo "==> Starting rolling restart of containers..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "==> Verifying Deployment Healthcheck..."
            sleep 10
            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
            if [ "$HEALTH_STATUS" -ne 200 ]; then
              echo "Deployment healthcheck failed with status: $HEALTH_STATUS! Rolling back..."
              docker compose -f docker-compose.prod.yml rollback || true
              exit 1
            fi
            echo "Deployment succeeded with HTTP 200 OK!"
